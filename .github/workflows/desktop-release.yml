name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: microsoft/setup-msbuild@v2
      - run: npm ci
      - name: Create a newer app version for this build
        shell: pwsh
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - name: Create release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git tag "v$version"
          git push origin "v$version"
      - name: Build Windows process audio helper
        shell: pwsh
        run: |
          $buildOutput = & msbuild native/process-audio-capture/process-audio-capture.vcxproj /p:Configuration=Release /p:Platform=x64 /m 2>&1
          $buildOutput | Write-Output
          if ($LASTEXITCODE -ne 0) {
            $compilerErrors = ($buildOutput | Where-Object { $_ -match ': error ' } | Select-Object -First 12) -join ' | '
            $annotation = $compilerErrors.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=native/process-audio-capture/process-audio-capture.cpp,line=1::$annotation"
            "### Native audio build error`n``````text`n$($buildOutput -join "`n")`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }
      # The app must work on a machine that has never heard of GStreamer, so the runtime ships inside it.
      # The published installer is Inno Setup, not an MSI -- the .msi URL does not exist at all, which is
      # what the first attempt at this step discovered the hard way.
      - name: Install GStreamer runtime
        shell: pwsh
        run: |
          $version = '1.28.6'
          $sha256 = '059251444D1267B486EBA390B18D25FED87E10315E72F757EC6C7E912FA746B5'
          $installer = "$env:RUNNER_TEMP\gstreamer.exe"
          Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc/gstreamer-1.0-msvc-x86_64-$version.exe" -OutFile $installer
          # This runtime is shipped to everyone who installs the app, so what goes in is checked first.
          $actual = (Get-FileHash $installer -Algorithm SHA256).Hash
          if ($actual -ne $sha256) { throw "GStreamer download does not match the expected hash: $actual" }
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "GStreamer install failed ($($process.ExitCode))" }

      # Where Inno puts it depends on whether it installed per-user or machine-wide, so the build looks
      # for the executable rather than assuming a path -- assuming one is what failed here the first time.
      - name: Bundle GStreamer into the app
        shell: pwsh
        run: |
          $roots = @("$env:LOCALAPPDATA\Programs", $env:ProgramFiles, ${env:ProgramFiles(x86)}, 'C:\') | Where-Object { $_ }
          $found = $null
          foreach ($root in $roots) {
            $candidate = Join-Path $root 'gstreamer\1.0\msvc_x86_64\bin\gst-launch-1.0.exe'
            if (Test-Path $candidate) { $found = Split-Path $candidate -Parent; break }
          }
          if (-not $found) {
            Write-Host "Procurado em: $($roots -join ', ')"
            Get-ChildItem "$env:LOCALAPPDATA\Programs", 'C:\' -Filter 'gstreamer' -Directory -EA SilentlyContinue | ForEach-Object { Write-Host "existe: $($_.FullName)" }
            throw 'GStreamer installed but gst-launch-1.0.exe was not found'
          }
          Write-Host "GStreamer found at $found"
          $env:ENTRETELAS_GSTREAMER_DIR = $found
          node scripts/bundle-gstreamer.mjs

      - name: Build installer
        shell: pwsh
        run: npm run desktop:dist -- --publish never
      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/TelasShare-Setup.exe
            release/TelasShare-Setup.exe.blockmap
            release/TelasShare-Portable.exe
            release/latest.yml
