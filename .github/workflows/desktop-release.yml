name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create a newer app version for this build
        shell: pwsh
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - name: Create release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git tag "v$version"
          git push origin "v$version"
      - name: Build Windows process audio helper
        shell: pwsh
        run: |
          $buildOutput = & msbuild native/process-audio-capture/process-audio-capture.vcxproj /p:Configuration=Release /p:Platform=x64 /m 2>&1
          $buildOutput | Write-Output
          if ($LASTEXITCODE -ne 0) {
            "### Native audio build error`n``````text`n$($buildOutput -join "`n")`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }
      - name: Build installer
        shell: pwsh
        run: npm run desktop:dist -- --publish never
      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/EntreTelas-Setup.exe
            release/EntreTelas-Setup.exe.blockmap
            release/EntreTelas-Portable.exe
            release/latest.yml
