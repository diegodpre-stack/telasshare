name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create a newer app version for this build
        shell: pwsh
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - name: Create release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git tag "v$version"
          git push origin "v$version"
      - name: Build and publish installer
        shell: pwsh
        run: npm run desktop:dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
