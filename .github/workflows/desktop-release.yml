name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create a newer app version for this build
        shell: pwsh
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - name: Create release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git tag "v$version"
          git push origin "v$version"
      - name: Build installer
        shell: pwsh
        run: npm run desktop:dist -- --publish never
      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/EntreTelas-Setup.exe
            release/EntreTelas-Setup.exe.blockmap
            release/latest.yml
