services:
  - type: web
    name: entretelas
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD_1
        sync: false
      - key: ADMIN_PASSWORD_2
        sync: false
      - key: ADMIN_PASSWORD_3
        sync: false
      - key: ADMIN_PASSWORD_4
        sync: false
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ANALYTICS_API_TOKEN
        sync: false
      - key: TURN_MONTHLY_LIMIT_GB
        value: 800
      - key: TURN_ENABLED
        value: false
