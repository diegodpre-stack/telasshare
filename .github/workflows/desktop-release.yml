name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: microsoft/setup-msbuild@v2
      - run: npm ci
      - name: Create a newer app version for this build
        shell: pwsh
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version
      - name: Create release tag
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          git tag "v$version"
          git push origin "v$version"
      - name: Build Windows process audio helper
        shell: pwsh
        run: |
          $buildOutput = & msbuild native/process-audio-capture/process-audio-capture.vcxproj /p:Configuration=Release /p:Platform=x64 /m 2>&1
          $buildOutput | Write-Output
          if ($LASTEXITCODE -ne 0) {
            $compilerErrors = ($buildOutput | Where-Object { $_ -match ': error ' } | Select-Object -First 12) -join ' | '
            $annotation = $compilerErrors.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error file=native/process-audio-capture/process-audio-capture.cpp,line=1::$annotation"
            "### Native audio build error`n``````text`n$($buildOutput -join "`n")`n``````" | Add-Content $env:GITHUB_STEP_SUMMARY
            exit $LASTEXITCODE
          }
      # The app must work on a machine that has never heard of GStreamer, so the runtime ships inside it.
      # INSTALLLEVEL=1000 selects every feature: the default install omits plugins, and a missing plugin
      # is not an error but a silently absent element.
      - name: Install GStreamer runtime
        shell: pwsh
        run: |
          $version = '1.28.6'
          $msi = "$env:RUNNER_TEMP\gstreamer.msi"
          Invoke-WebRequest -Uri "https://gstreamer.freedesktop.org/data/pkg/windows/$version/msvc/gstreamer-1.0-msvc-x86_64-$version.msi" -OutFile $msi
          $log = "$env:RUNNER_TEMP\gstreamer-install.log"
          $process = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/quiet', '/qn', 'INSTALLLEVEL=1000', '/l*v', "`"$log`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { Get-Content $log -Tail 40; throw "GStreamer install failed ($($process.ExitCode))" }

      - name: Bundle GStreamer into the app
        shell: pwsh
        run: node scripts/bundle-gstreamer.mjs

      - name: Build installer
        shell: pwsh
        run: npm run desktop:dist -- --publish never
      - name: Publish release files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/TelasShare-Setup.exe
            release/TelasShare-Setup.exe.blockmap
            release/TelasShare-Portable.exe
            release/latest.yml
